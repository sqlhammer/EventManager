# Reference deployment for the EventManager cloud backend (Infra Design, Q1-Q5=A).
# Provider-agnostic; no cloud IaC (NFR-6.4). Only the proxy :443 is published.
# Run from the backend/ directory (per the testing guide): `cd backend && docker compose up --build`.
# The build context is the repo root (..) so the Dockerfile can copy shared/ + backend/;
# volume paths are relative to this file's directory (backend/).
services:
  proxy:
    image: caddy:2.8
    depends_on: [api]
    ports:
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: backend/EventManager.Api/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Development so the app applies EF migrations at startup (Program.cs) — this local stack has
      # no other schema-creation path (db port isn't published for a manual `dotnet ef database update`).
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: "Host=db;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Jwt__SigningKey: "${JWT_SIGNING_KEY}"
    expose:
      - "8080"
    restart: unless-stopped

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    volumes:
      - pgdata:/var/lib/postgresql/data   # encrypted volume in prod (Q5=A / NFR-2.3)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backup:
    image: postgres:17
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      BACKUP_ENCRYPTION_KEY: "${BACKUP_ENCRYPTION_KEY}"
    volumes:
      - ./backup/backup.sh:/backup.sh:ro
      - backups:/backups
    entrypoint: ["/bin/sh", "-c", "while true; do /backup.sh; sleep 86400; done"]  # daily (NFR-3.10)
    restart: unless-stopped

volumes:
  pgdata:
  backups:
  caddy_data:
  caddy_config:
