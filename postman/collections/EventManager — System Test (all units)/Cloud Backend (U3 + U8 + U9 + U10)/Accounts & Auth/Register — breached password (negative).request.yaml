$kind: http-request
description: Expect a rejection — the common-password check blocks `password`.
url: "{{cloudBaseUrl}}/api/accounts/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "breach@example.com",
      "password": "password"
    }
auth:
  type: noauth
order: 2000
