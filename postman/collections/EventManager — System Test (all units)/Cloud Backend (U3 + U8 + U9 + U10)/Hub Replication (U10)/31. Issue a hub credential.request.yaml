$kind: http-request
description: US-801. Issues an event-scoped hub credential. The key is returned EXACTLY ONCE and only a hash is stored, so it cannot be retrieved again — the test captures it into {{hubCredentialKey}}.
url: "{{cloudBaseUrl}}/api/events/{{eventId}}/hub-credentials"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "label": "main hub"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      const b = pm.response.json();
      pm.test('the key is returned once', () => pm.expect(b.key).to.be.a('string').and.not.empty);
      pm.test('carries a visible expiry', () => pm.expect(b.expiresAt).to.be.a('string'));
      pm.collectionVariables.set('hubCredentialKey', b.key);
      pm.collectionVariables.set('hubCredentialId', b.credentialId);
    language: text/javascript
order: 1000
