$kind: http-request
description: US-801 / BR-REPL-24. Listing shows label, dates and derived state — never key material.
url: "{{cloudBaseUrl}}/api/events/{{eventId}}/hub-credentials"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      const rows = pm.response.json();
      pm.test('no key material in any row', () => pm.expect(rows.every(r => !('key' in r) && !('keyHash' in r))).to.be.true);
      pm.test('state is derived, not stored', () => pm.expect(rows.every(r => ['Active','Expired','Revoked'].includes(r.state))).to.be.true);
    language: text/javascript
order: 2000
