$kind: http-request
description: US-809 / BR-REPL-7. Unknown, expired and revoked all produce the SAME generic failure, so the endpoint cannot be used to probe which credentials exist.
url: "{{cloudBaseUrl}}/api/ingest/batch"
method: POST
headers:
  Content-Type: application/json
  X-Hub-Credential: this-key-was-never-issued
body:
  type: text
  content: |-
    {
      "events": []
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('refused', () => pm.expect(pm.response.code).to.be.oneOf([401, 403]));
      pm.test('discloses nothing about why', () => pm.expect(pm.response.text()).to.not.match(/revoked|expired|unknown/i));
    language: text/javascript
order: 7000
