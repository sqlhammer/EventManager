$kind: http-request
description: US-808. Revocation is immediate and one-way — there is no un-revoke, the remedy is to issue a new credential. Already-replicated data is unaffected and the hub keeps running the event locally.
url: "{{cloudBaseUrl}}/api/events/{{eventId}}/hub-credentials/{{hubCredentialId}}"
method: DELETE
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
    language: text/javascript
order: 8000
