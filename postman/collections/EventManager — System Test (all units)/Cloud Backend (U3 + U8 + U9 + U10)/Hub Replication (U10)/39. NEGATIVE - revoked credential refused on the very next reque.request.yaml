$kind: http-request
name: 39. NEGATIVE - revoked credential refused on the very next request
description: US-808 / BR-REPL-8. Authentication is evaluated per request with no session or cache, which is what makes revocation effective immediately.
url: "{{cloudBaseUrl}}/api/ingest/batch"
method: POST
headers:
  Content-Type: application/json
  X-Hub-Credential: "{{hubCredentialKey}}"
body:
  type: json
  content: |-
    {
      "events": []
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test('refused immediately after revocation', () => pm.expect(pm.response.code).to.be.oneOf([401, 403]));
    language: text/javascript
order: 9000
