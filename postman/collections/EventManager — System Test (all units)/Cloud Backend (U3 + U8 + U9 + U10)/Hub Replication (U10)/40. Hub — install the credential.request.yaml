$kind: http-request
description: US-802. Closes U10-CON-5. Installing over an existing credential is REFUSED (409) — clear it first.
url: "{{hubBaseUrl}}/api/replication/credential"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "key": "{{hubCredentialKey}}",
      "cloudBaseUrl": "{{cloudBaseUrl}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('installed or already occupied', () => pm.expect(pm.response.code).to.be.oneOf([200, 409]));
    language: text/javascript
order: 10000
