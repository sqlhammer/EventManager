$kind: http-request
description: |-
  US-701/702/703. Public callers get the **summary** shape; Registrant and Organizer get **detail** (adds cardEnabled, checkInStarted, weighInPolicy, createdByAccountId).

  Captures the ETag into `eventEtag` for request 18.
url: "{{cloudBaseUrl}}/api/events/{{eventId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
        pm.test('200 OK', () => pm.response.to.have.status(200));
        const etag = pm.response.headers.get('ETag');
        pm.test('carries a strong ETag', () => pm.expect(etag).to.be.a('string'));
        if (etag) { pm.collectionVariables.set('eventEtag', etag); console.log('eventEtag =', etag); }
        const b = pm.response.json();
        console.log(b.cardEnabled === undefined ? 'tier: Public (summary shape)' : 'tier: Registrant/Organizer (detail shape)');
    language: text/javascript
order: 2000
