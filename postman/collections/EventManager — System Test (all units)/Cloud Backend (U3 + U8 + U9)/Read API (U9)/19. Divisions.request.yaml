$kind: http-request
description: US-705. Public tier and above. Completed divisions are excluded by default; add `?includeCompleted=true` to include them (BR-READ-15).
url: "{{cloudBaseUrl}}/api/events/{{eventId}}/divisions"
method: GET
scripts:
  - type: afterResponse
    code: pm.test('200 OK', () => pm.response.to.have.status(200));
    language: text/javascript
order: 4000
