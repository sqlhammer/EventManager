$kind: http-request
description: |-
  US-705. The id must belong to {{eventId}} — a division that exists under a different event returns 404 here, so cross-event probing reveals nothing (BR-READ-19).
url: "{{cloudBaseUrl}}/api/events/{{eventId}}/divisions/{{divisionId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
        pm.test('200 OK', () => pm.response.to.have.status(200));
    language: text/javascript
order: 6000
