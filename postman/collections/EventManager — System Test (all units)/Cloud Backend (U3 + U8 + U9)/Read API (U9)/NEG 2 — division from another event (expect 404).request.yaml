$kind: http-request
description: |-
  US-709 / BR-READ-19. Set `otherDivisionId` to a division belonging to a **different** event, then run this. A valid id under the wrong event path returns 404 — never 403, and never the resource.
url: "{{cloudBaseUrl}}/api/events/{{eventId}}/divisions/{{otherDivisionId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
        pm.test('404 Not Found', () => pm.response.to.have.status(404));
        pm.test('never 403', () => pm.expect(pm.response.code).to.not.eql(403));
    language: text/javascript
order: 14000
