$kind: http-request
description: |-
  US-709. Re-run this while authenticated as a Public or Registrant caller — someone who is **not** an organizer of {{eventId}}. The roster must return 404, not 403.

  Swap `accessToken` for a second account's token first; otherwise this is request 22 and will return 200.
url: "{{cloudBaseUrl}}/api/events/{{eventId}}/registrants"
method: GET
scripts:
  - type: afterResponse
    code: |-
        pm.test('404 for a non-organizer, 200 for an organizer', () => pm.expect([200, 404]).to.include(pm.response.code));
        pm.test('never 403', () => pm.expect(pm.response.code).to.not.eql(403));
    language: text/javascript
order: 15000
